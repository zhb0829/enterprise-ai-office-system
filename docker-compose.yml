services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eaos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eaos
      POSTGRES_PASSWORD: eaos_dev_password
      POSTGRES_DB: eaos
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"  # 宿主机 5432 被本机原生 PostgreSQL 占用，映射到 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaos -d eaos"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
