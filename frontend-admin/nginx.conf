# 管理端以 /admin/ 为 base 路径（vite base: '/admin/'），
# dist 物理位于 /usr/share/nginx/html/admin/，root 方式直接托管。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 兜底：任何未匹配路径回退到管理端入口
    location / {
        return 301 /admin/;
    }
}
