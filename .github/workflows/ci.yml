name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 检测变更
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'admin-server/**'
      - name: Maven 构建与测试
        if: steps.filter.outputs.changed == 'true'
        working-directory: admin-server
        run: mvn -B spotless:check verify
      - name: 构建镜像
        if: steps.filter.outputs.changed == 'true'
        run: docker build -t eaos/admin-server:${{ github.sha }} admin-server
      - name: 登录 ACR 并推送
        if: steps.filter.outputs.changed == 'true' && github.ref == 'refs/heads/main' && env.ACR_CONFIGURED == 'true'
        env:
          ACR_CONFIGURED: ${{ secrets.ACR_REGISTRY != '' && secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin
          docker tag eaos/admin-server:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/admin-server:${{ github.sha }}
          docker tag eaos/admin-server:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/admin-server:latest
          docker push ${{ secrets.ACR_REGISTRY }}/admin-server:${{ github.sha }}
          docker push ${{ secrets.ACR_REGISTRY }}/admin-server:latest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: 检测变更
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            frontend-admin:
              - 'frontend-admin/**'
      - name: 构建用户端
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run build
          docker build -t eaos/frontend:${{ github.sha }} .
      - name: 构建管理端
        if: steps.filter.outputs.frontend-admin == 'true'
        working-directory: frontend-admin
        run: |
          npm install
          npm run lint
          npm run build
          docker build -t eaos/frontend-admin:${{ github.sha }} .
      - name: 推送镜像
        if: github.ref == 'refs/heads/main' && env.ACR_CONFIGURED == 'true'
        env:
          ACR_CONFIGURED: ${{ secrets.ACR_REGISTRY != '' && secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            docker tag eaos/frontend:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/frontend:${{ github.sha }}
            docker tag eaos/frontend:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/frontend:latest
            docker push ${{ secrets.ACR_REGISTRY }}/frontend:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/frontend:latest
          fi
          if [ "${{ steps.filter.outputs.frontend-admin }}" = "true" ]; then
            docker tag eaos/frontend-admin:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/frontend-admin:${{ github.sha }}
            docker tag eaos/frontend-admin:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/frontend-admin:latest
            docker push ${{ secrets.ACR_REGISTRY }}/frontend-admin:${{ github.sha }}
            docker push ${{ secrets.ACR_REGISTRY }}/frontend-admin:latest
          fi
