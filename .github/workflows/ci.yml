name: Python AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 测试
        env:
          APP_ENV: test
        run: python -m pytest tests -q
      - name: 构建镜像
        run: docker build -t eaos/ai-service:${{ github.sha }} .
      - name: 推送镜像
        if: github.ref == 'refs/heads/main' && env.ACR_CONFIGURED == 'true'
        env:
          ACR_CONFIGURED: ${{ secrets.ACR_REGISTRY != '' && secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin
          docker tag eaos/ai-service:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/ai-service:${{ github.sha }}
          docker tag eaos/ai-service:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/ai-service:latest
          docker push ${{ secrets.ACR_REGISTRY }}/ai-service:${{ github.sha }}
          docker push ${{ secrets.ACR_REGISTRY }}/ai-service:latest
