# 企业AI智能办公系统 — 生产编排（Q1/Q8/Q16）
# 全新服务器：cp .env.example .env && 编辑密钥后  docker compose up -d
name: eaos

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eaos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [eaos]

  admin-server:
    image: ${ACR_REGISTRY}/admin-server:${EAOS_IMAGE_TAG:-latest}
    build: ../admin-server
    container_name: eaos-admin-server
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_BASE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      OPINION_INTERNAL_TOKEN: ${OPINION_INTERNAL_TOKEN}
      MEETING_INTERNAL_TOKEN: ${MEETING_INTERNAL_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      EAOS_STORAGE_ROOT: /data/storage/java
    volumes:
      - file-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [eaos]

  ai-service:
    image: ${ACR_REGISTRY}/ai-service:${EAOS_IMAGE_TAG:-latest}
    # Python 镜像由独立的 enterprise-ai-office-system-new 仓库构建并推送。
    container_name: eaos-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_API_KEY: ${LLM_API_KEY}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      OPINION_INTERNAL_TOKEN: ${OPINION_INTERNAL_TOKEN}
      OPINION_JAVA_BASE_URL: http://admin-server:8080
      OPINION_JAVA_TOKEN: ${OPINION_INTERNAL_TOKEN}
      MEETING_INTERNAL_TOKEN: ${MEETING_INTERNAL_TOKEN}
      MEETING_JAVA_BASE_URL: http://admin-server:8080
      MEETING_JAVA_TOKEN: ${MEETING_INTERNAL_TOKEN}
      QUAL_JAVA_BASE_URL: http://admin-server:8080
      INTELLIGENCE_JAVA_BASE_URL: http://admin-server:8080
      APP_ENV: production
      EXPORT_DIR: /data/storage/exports
      UPLOAD_DIR: /data/storage/uploads
    volumes:
      - file-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [eaos]

  frontend:
    image: ${ACR_REGISTRY}/frontend:${EAOS_IMAGE_TAG:-latest}
    build: ../frontend
    container_name: eaos-frontend
    restart: unless-stopped
    networks: [eaos]

  frontend-admin:
    image: ${ACR_REGISTRY}/frontend-admin:${EAOS_IMAGE_TAG:-latest}
    build: ../frontend-admin
    container_name: eaos-frontend-admin
    restart: unless-stopped
    networks: [eaos]

  gateway:
    image: ${ACR_REGISTRY}/gateway:${EAOS_IMAGE_TAG:-latest}
    build: ./gateway
    container_name: eaos-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      - admin-server
      - ai-service
      - frontend
      - frontend-admin
    networks: [eaos]

  # ---- 可观测性（Q13/Q18）----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: eaos-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [eaos]

  loki:
    image: grafana/loki:3.1.0
    container_name: eaos-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [eaos]

  promtail:
    image: grafana/promtail:3.1.0
    container_name: eaos-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks: [eaos]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: eaos-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    networks: [eaos]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: eaos-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_ALERT_EMAILS: ${GRAFANA_ALERT_EMAILS}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    networks: [eaos]

volumes:
  pgdata:
  file-storage:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  eaos:
    driver: bridge
