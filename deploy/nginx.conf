worker_processes 1;
error_log E:/project/enterprise-ai-office-system-admin/deploy/nginx-error.log notice;
pid E:/project/enterprise-ai-office-system-admin/deploy/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include C:/nginx/nginx-1.30.3/conf/mime.types;
  default_type application/octet-stream;
  access_log E:/project/enterprise-ai-office-system-admin/deploy/logs/access.log;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path E:/project/enterprise-ai-office-system-admin/deploy/temp/client_body;
  proxy_temp_path E:/project/enterprise-ai-office-system-admin/deploy/temp/proxy;
  fastcgi_temp_path E:/project/enterprise-ai-office-system-admin/deploy/temp/fastcgi;
  uwsgi_temp_path E:/project/enterprise-ai-office-system-admin/deploy/temp/uwsgi;
  scgi_temp_path E:/project/enterprise-ai-office-system-admin/deploy/temp/scgi;

  server {
    listen 80;
    server_name localhost 127.0.0.1;

    location /api/ {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
      alias E:/project/enterprise-ai-office-system-admin/frontend-admin/dist/;
      try_files $uri $uri/ /admin/index.html;
      index index.html;
    }

    location / {
      root E:/project/enterprise-ai-office-system-admin/frontend/dist;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    # 开发环境入口文件必须及时更新，避免浏览器继续使用旧的动态 chunk。
    location = /index.html {
      root E:/project/enterprise-ai-office-system-admin/frontend/dist;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
      expires -1;
    }
  }
}
