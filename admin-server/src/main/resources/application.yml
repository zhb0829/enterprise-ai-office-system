server:
  port: 8080

spring:
  application:
    name: admin-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:eaos}
    username: ${DB_USER:eaos}
    password: ${DB_PASSWORD:eaos_dev_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

eaos:
  security:
    # 开发阶段默认关闭认证（设为 true 或环境变量 SECURITY_ENABLED=true 开启）
    enabled: ${SECURITY_ENABLED:false}
  jwt:
    # 生产环境必须通过 JWT_SECRET 环境变量替换（HS256 要求 >= 32 字节）
    secret: ${JWT_SECRET:eaos-dev-secret-key-change-me-in-production-0123456789}
    expire-minutes: 1440
  ai:
    # 独立 Python agent 服务（E:\project\enterprise-ai-office-system-new）内网地址
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-prefix: /internal
  opinion:
    # 服务间共享令牌：Python Worker 调用本服务 /internal/opinion/** 的校验值（生产必须换）
    internal-token: ${OPINION_INTERNAL_TOKEN:eaos-opinion-internal-dev-token}
    max-items-per-ingest: 200
    max-analysis-jobs-per-collect: 200
    max-analysis-retries: ${OPINION_MAX_ANALYSIS_RETRIES:3}
    stale-task-minutes: ${OPINION_STALE_TASK_MINUTES:15}
    notification-max-retries: ${OPINION_NOTIFICATION_MAX_RETRIES:3}
    auto-report-enabled: ${OPINION_AUTO_REPORT_ENABLED:true}
    # 告警 Webhook 回调地址（可选，为空则不发送）
    webhook-url: ${OPINION_WEBHOOK_URL:}

logging:
  level:
    com.eaos.admin: info
