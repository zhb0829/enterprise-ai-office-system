server:
  port: 8080

spring:
  application:
    name: admin-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:eaos}
    username: ${DB_USER:eaos}
    password: ${DB_PASSWORD:eaos_dev_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 510MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

eaos:
  jwt:
    # 生产环境必须通过 JWT_SECRET 环境变量替换（HS256 要求 >= 32 字节），默认值拒绝启动
    secret: ${JWT_SECRET:}
    # access token 有效期 2 小时
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
    # refresh token 有效期 7 天（服务端哈希存储，可吊销）
    refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  storage:
    # 统一文件存储根目录（FileStorage 抽象，替换散落的 qual-storage/meeting-storage）
    root: ${EAOS_STORAGE_ROOT:storage}
  ai:
    # 独立 Python AI 服务内网地址
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-prefix: /internal
    internal-token: ${AI_INTERNAL_TOKEN:}
  rate-limit:
    # G3 网关层租户资源隔离：令牌桶（rps/burst）+ 并发配额，超限快速失败 429，不排队。
    # AI 服务侧另有 app/resource_guard.py 作为第二道防线。
    enabled: ${RATE_LIMIT_ENABLED:true}
    rps: ${RATE_LIMIT_RPS:50}
    burst: ${RATE_LIMIT_BURST:100}
    # 0 表示该维度不限
    max-concurrency: ${RATE_LIMIT_MAX_CONCURRENCY:32}
    global-concurrency: ${RATE_LIMIT_GLOBAL_CONCURRENCY:128}
    exempt-paths: ${RATE_LIMIT_EXEMPT_PATHS:/api/auth,/api/health,/actuator,/swagger-ui,/v3/api-docs,/internal,/error}
    # 按租户覆盖（键为 sys_user.tenant_id，例如 tenants.7.rps=5）；缺省项回落全局默认
    tenants: {}
  opinion:
    # Python Worker 调用本服务 /internal/opinion/** 使用的服务间令牌
    internal-token: ${OPINION_INTERNAL_TOKEN:}
    max-items-per-ingest: 200
    max-analysis-jobs-per-collect: 200
    max-analysis-retries: ${OPINION_MAX_ANALYSIS_RETRIES:3}
    stale-task-minutes: ${OPINION_STALE_TASK_MINUTES:15}
    notification-max-retries: ${OPINION_NOTIFICATION_MAX_RETRIES:3}
    auto-report-enabled: ${OPINION_AUTO_REPORT_ENABLED:true}
    webhook-url: ${OPINION_WEBHOOK_URL:}
  qual:
    citation-min-score: ${QUAL_CITATION_MIN_SCORE:0.72}
  meeting:
    internal-token: ${MEETING_INTERNAL_TOKEN:}

logging:
  pattern:
    # traceId 由 TraceIdFilter 生成/透传，Loki 可按该字段检索（Q13）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.eaos.admin: info
